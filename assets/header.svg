<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="bIDE — a terminal editor written in C">
  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="879" height="229" rx="12"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <g clip-path="url(#win)">
    <rect width="880" height="230" fill="#0d1117"/>

    <!-- title bar -->
    <rect width="880" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
    <text class="mono" x="440" y="22" font-size="12" fill="#7d8590" text-anchor="middle">bIDE — src/main.c</text>

    <!-- wordmark -->
    <text class="mono" x="46" y="118" font-size="62" font-weight="700" fill="url(#glow)">b</text>
    <text class="mono" x="88" y="118" font-size="62" font-weight="700" fill="#e6edf3">IDE</text>
    <rect x="204" y="76" width="26" height="50" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text class="mono" x="48" y="152" font-size="14" fill="#8b949e">a terminal text editor, written from scratch in C17</text>
    <text class="mono" x="48" y="174" font-size="13" fill="#6e7681">buffers · undo · multi-cursor · syntax · LSP</text>

    <!-- code panel -->
    <rect x="496" y="34" width="1" height="162" fill="#21262d"/>
    <g class="mono" font-size="12.5">
      <text x="524" y="68"  fill="#484f58">31</text><text x="560" y="68"  fill="#ff7b72">while</text><text x="606" y="68" fill="#c9d1d9">(1) {</text>
      <text x="524" y="90"  fill="#484f58">32</text><text x="576" y="90"  fill="#8b949e">// wait on stdin *and* every server pipe</text>
      <text x="524" y="112" fill="#484f58">33</text><text x="576" y="112" fill="#d2a8ff">Poll</text><text x="612" y="112" fill="#c9d1d9">(fds, nfds, </text><text x="712" y="112" fill="#79c0ff">timeout</text><text x="776" y="112" fill="#c9d1d9">);</text>
      <text x="524" y="134" fill="#484f58">34</text><text x="576" y="134" fill="#d2a8ff">lsp_dispatch</text><text x="684" y="134" fill="#c9d1d9">(...);</text>
      <text x="524" y="156" fill="#484f58">35</text><text x="560" y="156" fill="#c9d1d9">}</text>
      <text x="524" y="178" fill="#484f58">36</text>
    </g>

    <!-- status bar -->
    <rect y="196" width="880" height="34" fill="#161b22"/>
    <rect y="196" width="880" height="1" fill="#21262d"/>
    <rect y="196" width="112" height="34" fill="#1f6feb"/>
    <text class="mono" x="16" y="217" font-size="12" font-weight="700" fill="#ffffff">main.c</text>
    <text class="mono" x="128" y="217" font-size="12" fill="#7d8590">clangd ready · 0 errors</text>
    <text class="mono" x="864" y="217" font-size="12" fill="#7d8590" text-anchor="end">c | 33:14</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="229" rx="12" fill="none" stroke="#30363d"/>
</svg>
